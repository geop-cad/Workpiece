name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lints, tests (Linux)
    runs-on: ubuntu-latest
    # The tests took 46 s with a warm build cache on a developer machine;
    # a cold build of the dependencies and the workspace takes much longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (a branch: the toolchain is named below)
        with:
          toolchain: stable
          components: clippy, rustfmt
      # The build needs only a C compiler, which the runner has. The app's window
      # and OpenGL libraries are loaded when it runs, not when it is built or tested.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: The Python layer builds a part
        run: |
          cargo build --release --locked -p workpiece-cli
          PYTHONPATH=python python3 agent/examples/flange.py /tmp/flange.wpc

  build:
    name: Builds (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times a Linux minute, so the whole workspace is only
        # compiled there (no tests); release.yml builds and packs both for real.
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (a branch: the toolchain is named below)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Compile the programs
        run: cargo build --release --locked -p workpiece-app -p workpiece-cli
      - name: Run the command line
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=.exe
          target/release/workpiece$ext --version
          target/release/workpiece-app$ext --version
