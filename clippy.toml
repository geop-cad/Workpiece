# A part builds the same on every target: in the browser (wasm32) as on the desktop. std's
# sines, logarithms and powers of an f64 are the platform's C library's (glibc, Apple's,
# Microsoft's; on wasm32 a port of musl's), which differ in the last bit, and a last bit can
# tip a tolerance and with it a step (the cast bracket's fillets did). The libm crate's are
# the same code everywhere. glam's turns and angles use std's: workpiece_core::math has them
# of libm's. (Not glam's "libm" feature: that makes its square roots and floors libm's too,
# which in a browser are done in software, a build half again as slow.) f32 is for pictures
# only and is left alone.
disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin: the same on every target" },
  { path = "f64::cos", reason = "use libm::cos: the same on every target" },
  { path = "f64::tan", reason = "use libm::tan: the same on every target" },
  { path = "f64::sin_cos", reason = "use libm::sincos: the same on every target" },
  { path = "f64::asin", reason = "use libm::asin: the same on every target" },
  { path = "f64::acos", reason = "use libm::acos: the same on every target" },
  { path = "f64::atan", reason = "use libm::atan: the same on every target" },
  { path = "f64::atan2", reason = "use libm::atan2: the same on every target" },
  { path = "f64::sinh", reason = "use libm::sinh: the same on every target" },
  { path = "f64::cosh", reason = "use libm::cosh: the same on every target" },
  { path = "f64::tanh", reason = "use libm::tanh: the same on every target" },
  { path = "f64::asinh", reason = "use libm::asinh: the same on every target" },
