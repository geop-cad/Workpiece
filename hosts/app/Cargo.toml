[package]
name = "workpiece-app"
description = "The desktop application: the cad-ui view drawn with egui, and the viewport with OpenGL (WebGL on the web)."
edition.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "workpiece-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
bytemuck = "1.25.2"
glam.workspace = true
workpiece-core.workspace = true
workpiece-ops-drawing.workspace = true
workpiece-boolean.workspace = true
workpiece-ops-step.workspace = true
workpiece-part.workspace = true
workpiece-ops-basic-shapes.workspace = true
workpiece-ops-datum.workspace = true
workpiece-ops-blend.workspace = true
workpiece-ops-bodies.workspace = true
workpiece-shape.workspace = true
workpiece-ops-instances.workspace = true
workpiece-ops-sketch.workspace = true
workpiece-rasterize.workspace = true
workpiece-ui.workspace = true
workpiece-ops-appearance.workspace = true
workpiece-render.workspace = true
# Pictures are saved as PNG files.
png = "0.18.1"
# The glow renderer: OpenGL on desktop, WebGL in the browser.
eframe = { workspace = true, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "wayland",
    "x11",
] }
# SVG icons.
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
# `Instant` that also works in a browser (on desktop it is std's).
web-time = "1.1.0"

# In the browser (see `src/web.rs`): the page, its files and its storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde.workspace = true
# What the command line does, for the assistant's scripts (`src/kernel.rs`).
workpiece-make.workspace = true
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Performance",
    "Request",
    "Response",
    "Storage",
    "Url",
    "UrlSearchParams",
    "Window",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: OpenGL calls are unsafe, and the renderer module allows them.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
