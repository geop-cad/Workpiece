[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workpiece"
dynamic = ["version"]
description = "Workpiece: a parametric CAD kernel and desktop app, with a Python layer for writing parts as scripts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["cad", "brep", "nurbs", "parametric", "step"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# Cropping and tiling pictures (`workpiece.crop`, `workpiece.tile`). Reading PDF sheets also
# needs poppler's pdftoppm on the PATH, which pip cannot bring.
images = ["Pillow"]

[project.urls]
Homepage = "https://github.com/geop-cad/Workpiece"
Source = "https://github.com/geop-cad/Workpiece"

[project.scripts]
workpiece = "workpiece.cli:main"
workpiece-app = "workpiece.__main__:main"
workpiece-tools = "workpiece.tools:main"

[tool.setuptools]
packages = ["workpiece"]
include-package-data = false

[tool.setuptools.package-data]
workpiece = ["README.md", "bin/*"]
